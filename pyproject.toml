[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syfter"
version = "0.9.2.0"
description = "Enterprise SBOM platform for RPM and container image scanning at scale"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vincent Danen", email = "vdanen@redhat.com"},
    {name = "Christopher Lusk"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "packageurl-python>=0.11",
    "httpx>=0.25",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "python-multipart>=0.0.31",
    "alembic>=1.13",
    "PyJWT[crypto]>=2.8",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "black>=26.10.1",
    "ruff>=0.1",
    "httpx2>=2.0; python_version >= '3.11'",
]
all = [
    "syfter[server,dev]",
]

[project.scripts]
syfter = "syfter.cli:main"
syfter-server = "server.main:run_server"

[project.urls]
Homepage = "https://github.com/vdanen/syfter"
Repository = "https://github.com/vdanen/syfter"

[tool.setuptools.packages.find]
where = ["."]
include = ["syfter*", "server*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
